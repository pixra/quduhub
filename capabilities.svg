<text x="120.0" y="268" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#f4f6fa">Artifact and Diagram Rendering</text><text x="120.0" y="276" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#9aa4b2">Rich markdown and math in responses, rendered</text><text x="120.0" y="298" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#9aa4b2">Mermaid architecture diagrams, and syntax-</text><text x="120.0" y="320" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#9aa4b2">highlighted code blocks you can copy in one click.</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.6s" dur=".8s" fill="freeze"/>
