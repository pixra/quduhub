<text x="712.0" y="74" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#f4f6fa">Universal Document Viewer</text><text x="712.0" y="82" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#9aa4b2">Open markdown documents, code files and reading</text><text x="712.0" y="104" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#9aa4b2">material in side-by-side tabs. Query the model</text><text x="712.0" y="126" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#9aa4b2">about a specific section without losing your</text><text x="712.0" y="148" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#9aa4b2">place.</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.4s" dur=".8s" fill="freeze"/>
