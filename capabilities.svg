<text x="48.0" y="124" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#f4f6fa">Technical Code Analysis</text><text x="48.0" y="150" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#e5383b">Debug algorithms and explore alternatives</text><text x="48.0" y="178" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#9aa4b2">Paste a routine into the conversation to</text><text x="48.0" y="200" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#9aa4b2">find edge cases, verify time complexity,</text><text x="48.0" y="222" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#9aa4b2">or inspect a functional equivalent in</text><text x="48.0" y="244" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#9aa4b2">another language.</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.2s" dur=".8s" fill="freeze"/>
