<text x="837.3333333333334" y="124" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#f4f6fa">System and Workflow Design</text><text x="837.3333333333334" y="150" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#e5383b">Draft architectures and visual flows</text><text x="837.3333333333334" y="178" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#9aa4b2">Work through API endpoints, state</text><text x="837.3333333333334" y="200" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#9aa4b2">machines and data pipelines, with</text><text x="837.3333333333334" y="222" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#9aa4b2">Mermaid diagrams rendered right inside</text><text x="837.3333333333334" y="244" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#9aa4b2">the conversation.</text></g><rect x=".5" y=".5" width="1199" height="309" rx="20" fill="none" stroke="#2a1b1f"/></svg>
