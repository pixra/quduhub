<text x="120.0" y="74" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#f4f6fa">Multi-Turn Reasoning</text><text x="120.0" y="82" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#9aa4b2">Iterative technical dialogue with context retained</text><text x="120.0" y="104" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#9aa4b2">across turns. Ask follow-ups, request alternative</text><text x="120.0" y="126" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#9aa4b2">architectures and refine complex solutions in</text><text x="120.0" y="148" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#9aa4b2">place.</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.2s" dur=".8s" fill="freeze"/>
