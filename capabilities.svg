<text x="712.0" y="268" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#f4f6fa">Workspace Memory and Preferences</text><text x="712.0" y="276" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#9aa4b2">Personal instructions, custom appearance modes,</text><text x="712.0" y="298" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#9aa4b2">local vault archiving and interface layouts that</text><text x="712.0" y="320" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#9aa4b2">persist throughout your sessions.</text></g><rect x=".5" y=".5" width="1199" height="403" rx="20" fill="none" stroke="#2a1b1f"/></svg>