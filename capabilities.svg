<text x="442.6666666666667" y="124" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#f4f6fa">Structured Document Synthesis</text><text x="442.6666666666667" y="150" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#e5383b">Pull key concepts from reference material</text><text x="442.6666666666667" y="178" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#9aa4b2">Load documents into the workspace and</text><text x="442.6666666666667" y="200" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#9aa4b2">ask for section summaries, comparison</text><text x="442.6666666666667" y="222" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#9aa4b2">matrices or step-by-step implementation</text><text x="442.6666666666667" y="244" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#9aa4b2">notes.</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.4s" dur=".8s" fill="freeze"/>
